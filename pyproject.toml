[project]
name = "policyci"
version = "0.1.0"
description = "CI for robot policies — regression diff, perturbation sweeps, deploy gate on LeRobot/LIBERO"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "modal>=0.73",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
visualize = [
    "rerun-sdk>=0.32.1,<0.33",
]
aloha-demo = [
    "av>=14,<17",
    "huggingface-hub>=0.34,<1",
    "pillow>=10,<13",
    "pyarrow>=17,<24",
]

[project.scripts]
robolens = "policyci.cli:app"
policyci = "policyci.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyci"]

# src-layout: hatchling maps src/policyci → policyci

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires an external robotics runtime such as ROS 2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel.force-include]
"src/policyci/report/templates" = "policyci/report/templates"
